server {
  listen 5173;
  server_name localhost;

  # Directory where our static files are located
  root /usr/share/nginx/html;
  # The default file to serve
  index index.html;

  location / {
    # This is the magic for single-page applications (SPA).
    # It tries to find the file corresponding to the URI,
    # then tries it as a directory, and if both fail,
    # it falls back to serving /index.html.
    # This allows client-side routing (e.g., React Router) to handle the URL.
    try_files $uri $uri/ /index.html;
  }

  # Optional: You can add other configurations here, for example,
  # for caching, security headers, etc.
}
