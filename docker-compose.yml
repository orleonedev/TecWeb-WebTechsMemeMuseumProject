version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
      - sqlite_data:/db
    environment:
      - DATABASE_URL=file:/db/dev.db
      - CLIENT_ORIGIN=${CLIENT_ORIGIN:-http://localhost:5173}
    command: sh -c "npx prisma db push && npx prisma db seed && npm run dev"

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3000}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  sqlite_data:
